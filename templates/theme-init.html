  <script>
    // 描画前にテーマを当て、切り替え前の表示が一瞬見えるのを防ぐ（rfc-translater と同じ仕組み）。
    // 保存した設定（isDarkMode）が無ければ、OS の設定（prefers-color-scheme）に従う。
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('isDarkMode'); } catch (e) {}
      var dark = saved === null ? window.matchMedia('(prefers-color-scheme: dark)').matches : saved === 'true';
      var root = document.documentElement;
      root.classList.toggle('dark-theme', dark);
      root.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
    })();
  </script>
